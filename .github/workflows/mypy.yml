name: Mypy

on:
  - push
  - pull_request

jobs:
    build:
        runs-on: ubuntu-latest
        name: Mypy
        steps:
        - uses: actions/checkout@v6
        - name: Set up Python 3.12
          uses: actions/setup-python@v6
          with:
              python-version: 3.12
        - name: Install Mypy
          run: pip install mypy types-requests
        - name: Mypy
          run: mypy .
