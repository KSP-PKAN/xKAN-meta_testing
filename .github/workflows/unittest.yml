name: Unit tests

on:
  - push
  - pull_request

jobs:
    build:
        runs-on: ubuntu-latest
        name: Unit tests
        steps:
        - uses: actions/checkout@v6
        - name: Set up Python 3.12
          uses: actions/setup-python@v6
          with:
              python-version: 3.12
        - name: Install
          run: |
              pip install 'git+https://github.com/KSP-CKAN/NetKAN-Infra#subdirectory=netkan'
              pip install .
        - name: Unit tests
          run: python -m unittest -v
